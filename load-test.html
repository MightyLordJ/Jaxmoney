<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Load Timing Test</title>
<style>
  :root{
    --page-bg:#0A0E0C; --card-bg:#1C1C1E; --text-primary:#F2F2F7; --text-secondary:#98989D;
    --purple:#5E5CE6; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --separator:#38383A;
    --font:-apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; height:100dvh; margin:0; overscroll-behavior:none; }
  body{ background:var(--page-bg); color:var(--text-primary); font-family:var(--font); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  .header{ padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom:1px solid var(--separator); flex:0 0 auto; }
  .header h1{ font-size:15px; margin:0 0 2px; color:var(--purple); }
  .header .sub{ font-size:11px; color:var(--text-secondary); line-height:1.5; }
  .btn-row{ flex:0 0 auto; display:flex; gap:8px; margin:10px 12px; }
  button{ flex:1; font-family:var(--font); font-size:13px; font-weight:600; padding:10px; border-radius:10px; border:none; cursor:pointer; }
  #btnCopy{ background:var(--purple); color:#fff; }
  #btnClear{ background:var(--card-bg); color:var(--red); }
  .list{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 12px 12px; }
  .entry{ background:var(--card-bg); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:12px; line-height:1.7; }
  .entry .row{ display:flex; justify-content:space-between; gap:8px; }
  .entry .label{ color:var(--text-secondary); }
  .entry .val{ font-weight:600; font-variant-numeric:tabular-nums; }
  .verdict{ font-size:12px; font-weight:700; margin-top:6px; padding-top:6px; border-top:1px solid var(--separator); }
  .verdict.good{ color:var(--green); }
  .verdict.bad{ color:var(--red); }
  .verdict.warn{ color:var(--orange); }
  .empty{ color:var(--text-secondary); font-size:13px; padding:20px 12px; text-align:center; }
</style>
</head>
<body>

<div class="header">
  <h1>啟動載入時間記錄</h1>
  <div class="sub">每次打開 index.html 都會自動記一筆。「有沒有被 SW 攔到」跟「TTFB」是判斷這次慢不慢、慢在哪的關鍵。完全關閉 App 重開幾次，再回來看這裡累積的記錄。</div>
</div>

<div class="btn-row">
  <button id="btnCopy">複製記錄</button>
  <button id="btnClear">清空記錄</button>
</div>

<div class="list" id="list"></div>

<script>
const KEY = "jaxmoney-loadlog";

function loadLog(){
  try{ return JSON.parse(localStorage.getItem(KEY) || "[]"); }catch(e){ return []; }
}

function verdictFor(e){
  if(e.controlledAtStart === false){
    return {tag:"bad", text:"⚠️ 這次啟動一開始沒有被 SW 控制 → navigation 繞過 SW，直接打了網路"};
  }
  if(typeof e.ttfbMs === "number"){
    if(e.ttfbMs > 800) return {tag:"warn", text:"TTFB 偏高（" + e.ttfbMs + "ms）→ 就算 SW 有控制，回應本身也不夠快"};
    return {tag:"good", text:"TTFB 很低（" + e.ttfbMs + "ms）→ 幾乎是瞬間拿到回應"};
  }
  return {tag:"warn", text:"缺少計時資料"};
}

function render(){
  const log = loadLog().slice().reverse();
  const list = document.getElementById("list");
  if(log.length === 0){
    list.innerHTML = '<div class="empty">還沒有記錄。完全關閉 JaxMoney、重新從主畫面打開幾次，再回來這裡看。</div>';
    return;
  }
  list.innerHTML = log.map(e=>{
    const v = verdictFor(e);
    return `<div class="entry">
      <div class="row"><span class="label">時間</span><span class="val">${e.t || "-"}</span></div>
      <div class="row"><span class="label">啟動時已被 SW 控制</span><span class="val">${e.controlledAtStart}</span></div>
      <div class="row"><span class="label">load 時已被 SW 控制</span><span class="val">${e.controlledAtEnd}</span></div>
      <div class="row"><span class="label">TTFB（拿到第一個位元組）</span><span class="val">${e.ttfbMs ?? "-"} ms</span></div>
      <div class="row"><span class="label">DOMContentLoaded</span><span class="val">${e.domContentLoaded ?? "-"} ms</span></div>
      <div class="row"><span class="label">load 事件</span><span class="val">${e.loadEnd ?? "-"} ms</span></div>
      <div class="row"><span class="label">transferSize</span><span class="val">${e.transferSize ?? "-"}</span></div>
      <div class="verdict ${v.tag}">${v.text}</div>
    </div>`;
  }).join("");
}

document.getElementById("btnCopy").addEventListener("click", ()=>{
  const text = JSON.stringify(loadLog(), null, 2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> alert("記錄已複製，共 " + loadLog().length + " 筆"))
      .catch(()=> alert("複製失敗，請手動選取"));
  }else{
    alert("這個瀏覽器不支援自動複製");
  }
});

document.getElementById("btnClear").addEventListener("click", ()=>{
  localStorage.removeItem(KEY);
  render();
});

render();
</script>

</body>
</html>
